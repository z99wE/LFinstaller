name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'llamafactory.spec'
      - 'build-windows.bat'
      - 'runtime_hooks.py'
      - 'src/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build with PyInstaller
        shell: cmd
        run: build-windows.bat

      - name: Verify executable exists
        shell: bash
        run: test -f dist/LLaMAFactory/LLaMAFactory.exe && echo "EXE present"

      - name: Smoke test — launch frozen exe and poll port 7860
        shell: pwsh
        timeout-minutes: 10
        run: |
          $proc = Start-Process -FilePath ".\dist\LLaMAFactory\LLaMAFactory.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:7860/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                $ok = $true
                Write-Host "Web UI responded with HTTP 200 after ~$($i * 2)s"
                break
              }
            } catch {
              # server not up yet
            }
            Start-Sleep -Seconds 2
          }
          if ($ok) {
            Write-Host "Gradio UI confirmed on port 7860"
          } else {
            Write-Host "FAILED: Web UI did not respond on port 7860"
          }
          # Force-kill the whole process tree so the step does not hang.
          & taskkill /F /T /PID $proc.Id 2>$null | Out-Null
          Start-Sleep -Seconds 2
          $log = Join-Path $HOME "llamafactory.log"
          if (Test-Path $log) {
            Write-Host "--- ~/llamafactory.log (tail) ---"
            Get-Content $log -Tail 50
          } else {
            Write-Host "(no log file)"
          }
          if (-not $ok) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLaMAFactory-windows
          path: dist/LLaMAFactory
          if-no-files-found: error
